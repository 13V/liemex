<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Liemex: the film (composition)</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* The composition the film is rendered from: a 1920 x 1080 stage. The working site sits in a window that a camera
   moves around; titles, captions and arrows are set over it. film/record.cjs steps the clock and photographs it. */
@font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "IBM Plex Mono"; src: url("/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
:root { --ink: #14100c; --paper: #f0e9dc; --red: #c4432a; --amber: #e3a857; --muted: #a99d8c; --io: cubic-bezier(0.7, 0, 0.2, 1); --out: cubic-bezier(0.16, 1, 0.3, 1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
body { font-family: "Archivo", sans-serif; color: var(--paper); -webkit-font-smoothing: antialiased; }
.stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink) repeating-linear-gradient(90deg, transparent 0 136px, rgba(240, 233, 220, 0.035) 136px 137px); }
.mono { font: 500 19px/1.2 "IBM Plex Mono", monospace; letter-spacing: 0.04em; }

/* The window */
.win { position: absolute; left: 0; top: 0; width: 1440px; transform-origin: 0 0; transform: translate(2100px, 173px) scale(0.86); transition: transform 1300ms var(--io), box-shadow 800ms; box-shadow: 0 60px 140px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(240, 233, 220, 0.14); border-radius: 14px; overflow: hidden; will-change: transform; }
.win.is-full { border-radius: 0; box-shadow: none; }
.win__bar { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 18px; background: #221b15; }
.win__bar i { width: 12px; height: 12px; border-radius: 50%; background: #4a3f35; }
.win__bar span { margin-left: 16px; font: 500 15px "IBM Plex Mono", monospace; color: var(--muted); }
.win iframe { display: block; width: 1440px; height: 810px; border: 0; background: var(--ink); }

/* Captions */
.cap { position: absolute; top: 250px; width: 520px; opacity: 0; transition: opacity 500ms; }
.cap.is-on { opacity: 1; }
.cap--l { left: 76px; } .cap--r { left: 1330px; }
.cap--low { left: 76px; top: auto; bottom: 118px; width: 900px; }
.cap--tl { left: auto; right: 60px; top: 56px; width: 640px; padding: 30px 34px 34px; background: rgba(20, 16, 12, 0.9); }
.cap--tl h2 { font-size: 78px; margin: 16px 0 14px; }
.cap--tl .cap__n b { font-size: 78px; }
.cap--tl p { font-size: 27px; }
.cap--tl i.rule { display: none; }
.cap__n { display: flex; align-items: baseline; gap: 16px; color: var(--amber); }
.cap__n b { font: 800 150px/0.8 "Archivo", sans-serif; font-stretch: 62%; color: transparent; -webkit-text-stroke: 2px var(--amber); }
.cap h2 { margin: 26px 0 22px; font: 800 96px/0.88 "Archivo", sans-serif; font-stretch: 64%; letter-spacing: -0.015em; text-transform: uppercase; }
.cap--low h2 { font-size: 120px; margin: 14px 0 16px; text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6); }
.cap--low .cap__n b { font-size: 84px; }
.cap p { font: 500 31px/1.28 "Archivo", sans-serif; font-stretch: 92%; color: #e4dccd; max-width: 17em; }
.cap--low p { font-size: 34px; max-width: 24em; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8); }
.cap i.rule { display: block; height: 3px; width: 100%; margin-bottom: 24px; background: var(--paper); transform-origin: 0 50%; transform: scaleX(0); transition: transform 900ms var(--io) 200ms; }
.cap.is-on i.rule { transform: scaleX(1); }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.02em 0.1em; margin: -0.06em -0.02em -0.1em; }
.w > span { display: inline-block; transform: translateY(112%); transition: transform 900ms var(--out); transition-delay: calc(var(--n) * 70ms + 150ms); }
.is-on .w > span { transform: none; }
.cap p, .cap__n { transform: translateY(22px); opacity: 0; transition: transform 800ms var(--out) 450ms, opacity 600ms 450ms; }
.cap__n { transition-delay: 0ms; }
.cap.is-on p, .cap.is-on .cap__n { transform: none; opacity: 1; }
.shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(20, 16, 12, 0.92) 0, rgba(20, 16, 12, 0.5) 30%, rgba(20, 16, 12, 0) 55%); opacity: 0; transition: opacity 800ms; pointer-events: none; }
.shade.is-on { opacity: 1; }

/* Arrow and dot */
.over { position: absolute; inset: 0; pointer-events: none; }
.over svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
.over path.line { fill: none; stroke: var(--paper); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.7)); }
.over path.line.is-on { stroke-dashoffset: 0; transition: stroke-dashoffset 800ms var(--io); }
.dot { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 6px rgba(240, 233, 220, 0.9), 0 4px 20px rgba(0, 0, 0, 0.6); transform: translate(-200px, -200px) scale(0); }
.dot.is-on { transition: scale 600ms var(--out); }
.dot::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--paper); animation: ping 1500ms var(--out) infinite; }
@keyframes ping { from { transform: scale(0.8); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }

/* Title cards */
.title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 110px; pointer-events: none; }
.title h1 { font: 900 340px/0.8 "Archivo", sans-serif; font-stretch: 62%; letter-spacing: -0.02em; text-transform: uppercase; }
.title h1 em { font-style: normal; color: var(--amber); }
.title p { margin-top: 52px; font: 500 46px/1.2 "Archivo", sans-serif; font-stretch: 92%; color: var(--muted); opacity: 0; transform: translateY(20px); transition: opacity 600ms 700ms, transform 800ms var(--out) 700ms; }
.title.is-on p { opacity: 1; transform: none; }
.title .w > span { transition-duration: 1000ms; transition-delay: calc(var(--n) * 110ms); }
.title.is-out .w > span { transform: translateY(-112%); transition: transform 600ms var(--io); transition-delay: calc(var(--n) * 40ms); }
.title.is-out p { opacity: 0; transition: opacity 300ms; }
.redot { display: inline-block; width: 0.16em; height: 0.16em; margin-left: 0.04em; border-radius: 50%; background: var(--red); vertical-align: baseline; }

/* Plank wipe: the film's cut */
.planks { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 20; }
.planks i { flex: 1; margin-right: -1px; background: var(--ink) repeating-linear-gradient(90deg, transparent 0 30px, rgba(240, 233, 220, 0.04) 30px 31px); border-right: 1px solid rgba(240, 233, 220, 0.1); transform: translateY(101%); }
.planks.is-in i { transform: translateY(0); transition: transform 620ms var(--io); transition-delay: calc(var(--k) * 45ms); }
.planks.is-out i { transform: translateY(-101%); transition: transform 760ms var(--io); transition-delay: calc(var(--k) * 45ms); }

/* Furniture */
.hud { position: absolute; z-index: 30; left: 76px; right: 76px; bottom: 44px; display: flex; align-items: center; gap: 28px; color: var(--muted); opacity: 0; transition: opacity 600ms; }
.hud.is-on { opacity: 1; }
.hud__bar { flex: 1; display: flex; gap: 8px; }
.hud__bar i { flex: 1; height: 4px; background: rgba(240, 233, 220, 0.2); overflow: hidden; }
.hud__bar i b { display: block; height: 100%; background: var(--paper); transform-origin: 0 50%; transform: scaleX(0); }
.mark { position: absolute; z-index: 30; left: 76px; top: 52px; display: flex; align-items: flex-start; gap: 6px; opacity: 0; transition: opacity 600ms; }
.mark.is-on { opacity: 1; }
.mark b { font: 900 46px/0.8 "Archivo", sans-serif; font-stretch: 62%; text-transform: uppercase; }
.mark i { width: 11px; height: 11px; border-radius: 50%; background: var(--red); }
.mark span { margin-left: 16px; color: var(--muted); }
</style>
</head>
<body>
<div class="stage" data-stage>
  <div class="win" data-win>
    <div class="win__bar"><i></i><i></i><i></i><span>liemex.com.au</span></div>
    <iframe data-site title="The Liemex site" src="about:blank"></iframe>
  </div>
  <div class="shade" data-shade></div>
  <div class="cap cap--l" data-cap>
    <i class="rule"></i>
    <div class="cap__n"><b data-c-n></b><span class="mono" data-c-k></span></div>
    <h2 data-c-h></h2>
    <p data-c-p></p>
  </div>
  <div class="over"><svg><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#f0e9dc" stroke-width="1.8" stroke-linecap="round"/></marker></defs><path class="line" data-arrow pathLength="1" marker-end="url(#ah)"/></svg><div class="dot" data-dot></div></div>
  <div class="title" data-title><h1 data-t-h></h1><p data-t-p></p></div>
  <div class="mark" data-mark><b>Liemex</b><i></i><span class="mono">The new website</span></div>
  <div class="hud" data-hud><span class="mono" data-hud-n>01 / 08</span><div class="hud__bar" data-hud-bar></div><span class="mono">Lumen adl</span></div>
  <div class="planks" data-planks></div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const win = $("[data-win]"), site = $("[data-site]"), cap = $("[data-cap]"), dot = $("[data-dot]"), arrow = $("[data-arrow]");
  const title = $("[data-title]"), planks = $("[data-planks]"), shade = $("[data-shade]"), hud = $("[data-hud]"), mark = $("[data-mark]");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // One clock. When the film is rendered the page clock is stepped by hand, but the browser hands animation frames
  // its own time. Give every frame the page clock instead, here and inside the site, so nothing runs ahead.
  const oneClock = (w) => { const raf = w.requestAnimationFrame.bind(w); w.requestAnimationFrame = (cb) => raf(() => cb(w.performance.now())); };
  oneClock(window);
  const io = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  // "|" breaks a line; a trailing "•" becomes the red dot
  const words = (s) => s.split("|").map((line, l) => line.split(" ").map((w, i) => `<span class="w"><span style="--n:${l * 2 + i}">${w.replace("\u2022", '<i class="redot"></i>')}</span></span>`).join(" ")).join("<br>");
  planks.innerHTML = [3, 1, 5, 0, 4, 2, 6, 3, 1].map((k) => `<i style="--k:${k}"></i>`).join("");
  const N = 8;
  $("[data-hud-bar]").innerHTML = "<i><b></b></i>".repeat(N);
  let sw, sd, target = null, pt = [0.5, 0.5], capSide = "l", arrowOn = false, cam = { x: 2100, y: 173, s: 0.86 };

  /* ---- camera ---- */
  const setCam = (x, y, s, ms = 1300) => { cam = { x, y, s }; win.style.transitionDuration = `${ms}ms`; win.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
  const view = {
    right: (ms) => { win.classList.remove("is-full"); mark.classList.add("is-on"); setCam(1920 - 76 - 1440 * 0.86, 173, 0.86, ms); },
    left: (ms) => { win.classList.remove("is-full"); mark.classList.add("is-on"); setCam(76, 173, 0.86, ms); },
    full: (ms) => { win.classList.add("is-full"); mark.classList.remove("is-on"); setCam(0, -44 * (1920 / 1440), 1920 / 1440, ms); },
    // push in until the thing at `sel` sits at a point on the stage
    onto: (sel, s, sx, sy, ms) => { const r = sd.querySelector(sel).getBoundingClientRect(); win.classList.add("is-full"); setCam(sx - (r.left + r.width / 2) * s, sy - (44 + r.top + r.height / 2) * s, s, ms); },
  };

  /* ---- site helpers ---- */
  const q = (s) => sd.querySelector(s);
  const top = (el) => el.getBoundingClientRect().top + sw.scrollY;
  const scrollTo = (to, ms) => new Promise((res) => { const from = sw.scrollY, s = performance.now(); const step = (now) => { const t = Math.min(1, (now - s) / ms); sw.scrollTo(0, from + (to - from) * io(t)); t < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
  const tween = (ms, fn) => new Promise((res) => { const s = performance.now(); const step = (now) => { const t = Math.min(1, (now - s) / ms); fn(io(t), t); t < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
  const load = () => new Promise((res) => { site.addEventListener("load", () => { sw = site.contentWindow; sd = site.contentDocument; oneClock(sw); sw.__roomLite = true; const st = sd.createElement("style"); st.textContent = "html{scrollbar-width:none}::-webkit-scrollbar{display:none}.callbar{display:none!important}.room__top{display:none!important}"; sd.head.append(st); res(); }, { once: true }); site.src = "/"; });

  /* ---- captions, arrows, cuts ---- */
  window.__marks = [];
  const caption = async (n, kicker, h, p, side) => {
    window.__marks.push([Math.round(performance.now() - window.__t0) / 1000, kicker]);
    cap.classList.remove("is-on");
    await wait(cap.dataset.used ? 380 : 0);
    cap.dataset.used = 1;
    capSide = side;
    cap.className = `cap cap--${side}`;
    shade.classList.toggle("is-on", side === "low");
    hud.style.opacity = side === "tl" ? 0 : "";
    $("[data-c-n]").textContent = String(n).padStart(2, "0");
    $("[data-c-k]").textContent = kicker;
    $("[data-c-h]").innerHTML = words(h);
    $("[data-c-p]").textContent = p;
    $("[data-hud-n]").textContent = `${String(n).padStart(2, "0")} / ${String(N).padStart(2, "0")}`;
    void cap.offsetWidth;
    cap.classList.add("is-on");
  };
  const line = (p) => { const el = $("[data-c-p]"); el.style.opacity = 0; setTimeout(() => { el.textContent = p; el.style.opacity = ""; }, 320); };
  const point = (sel, at = [0.5, 0.5]) => { target = sel; pt = at; arrowOn = false; arrow.classList.remove("is-on"); dot.classList.remove("is-on"); dot.style.scale = 0; if (!sel) { arrow.setAttribute("d", ""); arrow.style.visibility = "hidden"; return; } arrow.style.visibility = ""; setTimeout(() => { arrowOn = true; dot.classList.add("is-on"); dot.style.scale = 1; arrow.classList.add("is-on"); }, 60); };
  const cut = async (mid) => { planks.className = "planks is-in"; await wait(1000); await mid?.(); planks.className = "planks is-out"; await wait(450); planks.className = "planks"; };
  const card = async (h, p, hold) => { title.className = "title"; $("[data-t-h]").innerHTML = words(h); $("[data-t-p]").textContent = p || ""; void title.offsetWidth; title.classList.add("is-on"); await wait(hold); title.classList.add("is-out"); await wait(650); title.className = "title"; };
  const progress = (i, ms) => { const b = $("[data-hud-bar]").children[i].firstChild; b.style.transition = `transform ${ms}ms linear`; b.style.transform = "scaleX(1)"; for (let k = 0; k < i; k++) { const p = $("[data-hud-bar]").children[k].firstChild; p.style.transition = "none"; p.style.transform = "scaleX(1)"; } };

  // Keep the dot on its target and the arrow from the caption to the dot, every frame.
  const place = () => {
    requestAnimationFrame(place);
    if (!target || !sd) return;
    const el = sd.querySelector(target);
    if (!el) return;
    const w = win.getBoundingClientRect(), r = el.getBoundingClientRect(), s = w.width / 1440;
    const x = w.left + (r.left + r.width * pt[0]) * s, y = w.top + (44 + r.top + r.height * pt[1]) * s;
    dot.style.translate = "none";
    dot.style.transform = `translate(${x}px, ${y}px)`;
    const c = cap.getBoundingClientRect();
    let sx, sy;
    if (capSide === "tl") return;
    if (capSide === "l") { sx = c.right + 18; sy = c.top + 150; } else if (capSide === "r") { sx = c.left - 18; sy = c.top + 150; } else { sx = c.left + 620; sy = c.top - 10; }
    const d = Math.hypot(x - sx, y - sy) || 1, ex = x - ((x - sx) / d) * 34, ey = y - ((y - sy) / d) * 34;
    const k = capSide === "r" ? -0.2 : 0.2;
    arrow.setAttribute("d", `M${sx} ${sy}Q${(sx + x) / 2 - (y - sy) * k} ${(sy + y) / 2 + (x - sx) * k} ${ex} ${ey}`);
  };

  /* ---- the film ---- */
  const film = async () => {
    window.__t0 = performance.now();
    requestAnimationFrame(place);
    await wait(300);
    await card("A new website|for Liemex\u2022", "Port Adelaide's solid timber specialists", 2500);
    await card("A working|<em>demo</em>", "Here's what it does, and why.", 2100);

    // 01 The opening
    await cut(async () => { await load(); view.right(0); hud.classList.add("is-on"); });
    progress(0, 8200);
    caption(1, "The opening", "Solid timber.|Machined here.", "Three seconds in, a visitor knows what you sell and that you make it yourselves.", "l");
    await wait(3300);
    point(".hero h1", [0.34, 0.5]);
    await wait(2500);
    line("The phone number and the quote button never leave the screen.");
    point(".hdr .btn", [0.5, 0.6]);
    await wait(2400);

    // 02 What sets you apart
    progress(1, 6000);
    point(null);
    view.left();
    caption(2, "The pitch", "What a big-box|store can't say", "You match, machine and make to size. The words darken as they're read, so nobody skims it.", "r");
    await scrollTo(top(q(".statement")) - 90, 1300);
    scrollTo(top(q(".statement")) + 140, 4200);
    await wait(1500);
    point(".statement__text", [0.55, 0.45]);
    await wait(3200);

    // 03 The rack
    progress(2, 8400);
    point(null);
    view.right();
    caption(3, "The rack", "Seventeen|timbers", "Stood side by side as boards, the way you'd see them at the yard. One glance, no clicking through pages.", "l");
    await scrollTo(top(q("#species")) + 60, 1300);
    const boards = [...sd.querySelectorAll("[data-board]")];
    const open = (i) => boards.forEach((b, k) => b.classList.toggle("is-open", k === i));
    point(".board.is-open", [0.5, 0.7]);
    for (const i of [3, 6, 10, 13, 1]) { open(i); await wait(1250); }
    open(3);
    await wait(900);

    // 04 The room
    progress(3, 13500);
    point(null);
    cap.classList.remove("is-on");
    await wait(300);
    boards[3].click();
    view.full(1500);
    await wait(2600);
    caption(4, "The room", "See it laid|in a room", "Pick a timber and it goes down on the floor, the door and the skirting.", "tl");
    const cv = () => sd.querySelector("dialog.room canvas");
    const drag = async (dx, dy, ms) => { const c = cv(); if (!c) return; const E = (type, x, y) => c.dispatchEvent(new sw.PointerEvent(type, { clientX: x, clientY: y, pointerId: 7, bubbles: true })); c.setPointerCapture = () => {}; E("pointerdown", 900, 400); await tween(ms, (t) => E("pointermove", 900 + dx * t, 400 + dy * t)); E("pointerup", 900 + dx, 400 + dy); };
    await wait(1400);
    await drag(-360, 30, 2600);
    line("Change timber and the floor is relaid, board by board.");
    sd.querySelector('dialog.room [data-pick="tasmanian-oak"]')?.click();
    await wait(2600);
    drag(420, -40, 3000);
    await wait(1200);
    sd.querySelector('dialog.room [data-lay="herringbone"]')?.click();
    line("Boards or herringbone. It's the part they'll show someone else.");
    await wait(3600);

    // 05 The bench
    progress(4, 8200);
    await cut(async () => { try { sd.querySelector("dialog.room")?.close(); } catch {} view.left(0); sw.scrollTo(0, top(q("#bench"))); cap.classList.remove("is-on"); shade.classList.remove("is-on"); });
    caption(5, "The proof", "One board,|start to floor", "Sawn, dressed, profiled, finished, laid. You machine your own timber, and this shows it in ten seconds.", "r");
    const bench = q("#bench");
    scrollTo(top(bench) + bench.offsetHeight - 810, 6400);
    await wait(900);
    point(".bench__svg", [0.5, 0.5]);
    await wait(5900);

    // 06 The work
    progress(5, 6800);
    point(null);
    view.full();
    caption(6, "The work", "Your jobs.|Your photos.", "The page holds still while your floors, doors and decks run past.", "low");
    const work = q("#work");
    await scrollTo(top(work), 1000);
    await scrollTo(top(work) + (work.offsetHeight - 810) * 0.8, 5400);

    // 07 The calculator
    progress(6, 6600);
    view.right();
    caption(7, "The calculator", "How many|metres?", "A rough area goes in. Lineal metres come out, with a tenth added for cuts.", "l");
    await scrollTo(top(q("#calculator")) - 40, 1300);
    point(".calc__num output", [0.5, 0.5]);
    const area = q("[data-calc-area]");
    await tween(3200, (t) => { area.value = Math.round(40 + 88 * t); area.dispatchEvent(new sw.Event("input", { bubbles: true })); });
    await wait(1700);

    // 08 The quote
    progress(7, 6200);
    point(null);
    view.left();
    caption(8, "The quote", "Every path|ends here", "“Price this” carries the timber and the metres into the form. One short step to an enquiry.", "r");
    q("[data-calc-send]").click();
    await scrollTo(top(q("#quote")) + 30, 1500);
    point('.quote textarea[name="message"]', [0.5, 0.5]);
    await wait(4400);

    // End
    point(null);
    await cut(async () => { win.style.display = "none"; cap.classList.remove("is-on"); hud.classList.remove("is-on"); });
    await card("Four looks.|One site.", "Same features in each. Choose the one that's yours.", 2600);
    await card("Liemex\u2022", "A proposal from Lumen adl", 2600);
    window.__done = true;
  };

  window.__ready = false;
  window.__play = film;
  window.__duration = 68500;
  document.fonts.ready.then(() => Promise.all([document.fonts.load('900 100px "Archivo"'), document.fonts.load('500 20px "IBM Plex Mono"')])).then(() => { window.__ready = true; if (!location.search.includes("rec")) film(); });
})();
</script>
</body>
</html>
